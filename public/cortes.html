<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortes de caja · Zenit POS</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/pwa/lib/tema.css">
  <link rel="stylesheet" href="/pwa/lib/componentes.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { overflow: auto; }
    .pagina { max-width: 1100px; }
    table.cat td, table.cat th { font-size: 14px; }
  </style>
</head>
<body>
  <header class="barra">
    <h1>Cortes de caja</h1>
    <span class="atajos">Historial de turnos</span>
    <a class="enlace" href="/estadisticas.html">Estadísticas</a>
    <a class="enlace" href="/compras.html">Compras</a>
    <a class="enlace" href="/usuarios.html">Usuarios</a>
    <a class="enlace" href="/inventario.html">Inventario</a>
    <a class="enlace" href="/">← Volver a la caja</a>
  </header>
  <div class="pagina">
    <table class="cat">
      <thead><tr><th>#</th><th>Apertura</th><th>Cierre</th><th>Cajero(s)</th><th class="num">Ventas</th><th class="num">Total</th><th class="num">Esperado</th><th class="num">Contado</th><th class="num">Diferencia</th><th></th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
    <p id="vacio" class="ayuda" hidden>Todavía no hay cortes.</p>
    <div class="pie"><span id="info"></span><span><button class="btn sec peq" id="ant" type="button">← Anterior</button> <button class="btn sec peq" id="sig" type="button">Siguiente →</button></span></div>
  </div>

  <dialog id="dlg">
    <div id="detalle"></div>
    <div class="fila-btn"><button class="btn sec" id="imprimir" type="button">🖨 Reimprimir</button><button class="btn" id="cerrar" type="button">Cerrar</button></div>
  </dialog>
  <script type="module" src="/js/cortes.js"></script>
</body>
</html>
