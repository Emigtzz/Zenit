<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas · Zenit POS</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/pwa/lib/graficas.css">
  <link rel="stylesheet" href="/pwa/lib/tablero.css">
  <style>
    body { overflow: auto; }
    .pagina { max-width: 1200px; margin: 0 auto; padding: 16px; width: 100%; }
    .filtros { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .filtros input[type=date] { font-size: 15px; padding: 6px 9px; border: 2px solid var(--borde); border-radius: 8px; background: var(--panel); color: var(--texto); }
    .filtros .btn { padding: 6px 14px; font-size: 14px; }
  </style>
</head>
<body>
  <header class="barra">
    <h1>Estadísticas</h1>
    <span class="atajos">Ventas del negocio</span>
    <a class="enlace" href="/cortes.html">Cortes</a>
    <a class="enlace" href="/inventario.html">Inventario</a>
    <a class="enlace" href="/">← Volver a la caja</a>
  </header>
  <div class="pagina">
    <div class="filtros" role="group" aria-label="Día a consultar">
      <button class="btn sec" id="f-hoy" type="button">Hoy</button>
      <button class="btn sec" id="f-ayer" type="button">Ayer</button>
      <input type="date" id="f-dia" aria-label="Elegir día">
      <span id="actualizado" class="ayuda"></span>
    </div>
    <div id="error" hidden style="background:var(--error);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px"></div>
    <div id="tablero"></div>
  </div>
  <script type="module" src="/js/estadisticas.js"></script>
</body>
</html>
