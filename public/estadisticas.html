<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas · Zenit POS</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/pwa/lib/tema.css">
  <link rel="stylesheet" href="/pwa/lib/componentes.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/pwa/lib/graficas.css">
  <link rel="stylesheet" href="/pwa/lib/tablero.css">
  <style>
    body { overflow: auto; }
    .pagina { max-width: 1200px; }
    .filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .filtros input[type=date] { min-height: 36px; padding: 4px 10px; font-size: 15px; }
  </style>
</head>
<body>
  <header class="barra">
    <h1>Estadísticas</h1>
    <span class="atajos">Ventas del negocio</span>
    <a class="enlace" href="/cortes.html">Cortes</a>
    <a class="enlace" href="/inventario.html">Inventario</a>
    <a class="enlace" href="/">← Volver a la caja</a>
  </header>
  <div class="pagina">
    <div class="filtros" role="group" aria-label="Día a consultar">
      <button class="btn sec peq" id="f-hoy" type="button">Hoy</button>
      <button class="btn sec peq" id="f-ayer" type="button">Ayer</button>
      <input type="date" id="f-dia" aria-label="Elegir día">
      <span id="actualizado" class="ayuda"></span>
    </div>
    <div id="error" class="adv bloqueo" hidden></div>
    <div id="tablero"></div>
  </div>
  <script type="module" src="/js/estadisticas.js"></script>
</body>
</html>
