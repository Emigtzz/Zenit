<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Zenit POS</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/pwa/lib/tema.css">
  <link rel="stylesheet" href="/pwa/lib/componentes.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { display: grid; place-items: center; overflow: auto; padding: 20px; background: radial-gradient(1200px 500px at 50% -10%, #e9f0fa 0%, transparent 70%), var(--fondo); }
    .tarjeta-login { background: var(--panel); border: 1px solid var(--borde); border-radius: 20px; padding: 32px; width: min(460px, 94vw); box-shadow: var(--sombra-2); }
    .marca { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .marca img { width: 52px; height: 52px; border-radius: 14px; box-shadow: var(--sombra-1); }
    .tarjeta-login h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
    .sub { color: var(--suave); margin: 0 0 20px; font-size: 15px; }
    .usuarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .usuarios button { border: 1.5px solid var(--borde-fuerte); background: var(--panel); color: var(--texto); border-radius: 14px; padding: 18px 8px; font: inherit; font-weight: 650; font-size: 17px; cursor: pointer; transition: background-color .12s, border-color .12s; }
    .usuarios button:hover { background: var(--acento-suave); border-color: var(--acento); }
    .usuarios button:focus-visible { border-color: var(--acento); }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--suave); margin: 14px 0 5px; }
    input[type=password], input[type=text] { width: 100%; font-size: 22px; min-height: 52px; padding: 8px 14px; }
    .quien { font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; background: none; padding: 0; }
    .err { margin: 10px 0 0; min-height: 1.5em; }
    .ayuda a { color: var(--suave); }
    .tarjeta-login .btn { min-width: 140px; }
  </style>
</head>
<body>
  <main class="tarjeta-login">
    <div class="marca"><img src="/pwa/icons/icon-192.png" alt=""><h1 id="negocio">Zenit POS</h1></div>
    <p class="sub" id="sub">Cargando…</p>

    <section id="v-usuarios" hidden>
      <div class="usuarios" id="lista"></div>
    </section>

    <form id="f-login" hidden autocomplete="off">
      <div class="quien"><span id="quien"></span><a href="#" id="otro" class="ayuda">Cambiar</a></div>
      <label for="pass">Contraseña o PIN</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <p class="err" id="err-login" role="alert"></p>
      <div class="fila-btn"><button class="btn" type="submit">Entrar</button></div>
    </form>

    <form id="f-setup" hidden autocomplete="off">
      <p class="ayuda">Primer uso: crea la cuenta del <b>dueño</b>. Es quien administra catálogo, inventario y usuarios.</p>
      <label for="s-nombre">Tu nombre</label><input id="s-nombre" type="text" required minlength="2" maxlength="40">
      <label for="s-pass">Contraseña (mínimo 8 caracteres)</label><input id="s-pass" type="password" autocomplete="new-password" required minlength="8">
      <label for="s-pass2">Repite la contraseña</label><input id="s-pass2" type="password" autocomplete="new-password" required>
      <p class="err" id="err-setup" role="alert"></p>
      <div class="fila-btn"><button class="btn" type="submit">Crear dueño y entrar</button></div>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
